[workspace]
resolver = "2"
members = [
  "crates/diff-core",
  "crates/git-adapter",
  "crates/diff-cli",
  "crates/diff-tui",
  "crates/office-adapter",
  "crates/ai-adapter",
  "apps/desktop/src-tauri"
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
diff-core = { path = "crates/diff-core" }
diff-tui = { path = "crates/diff-tui" }
git-adapter = { path = "crates/git-adapter" }
office-adapter = { path = "crates/office-adapter" }
ai-adapter = { path = "crates/ai-adapter" }
ignore = "0.4"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = "2"
thiserror = "2"
walkdir = "2"
